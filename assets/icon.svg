<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="180" fill="url(#ballGlow)" />
  
  <!-- Football Silhouette -->
  <circle cx="256" cy="256" r="140" fill="#ffffff" stroke="#0f172a" stroke-width="12"/>
  
  <!-- Pentagon Center -->
  <polygon points="256,196 313,237 291,304 221,304 199,237" fill="#0f172a"/>
  
  <!-- Connecting lines & Outer patches -->
  <line x1="256" y1="196" x2="256" y2="120" stroke="#0f172a" stroke-width="10"/>
  <line x1="313" y1="237" x2="385" y2="214" stroke="#0f172a" stroke-width="10"/>
  <line x1="291" y1="304" x2="335" y2="370" stroke="#0f172a" stroke-width="10"/>
  <line x1="221" y1="304" x2="177" y2="370" stroke="#0f172a" stroke-width="10"/>
  <line x1="199" y1="237" x2="127" y2="214" stroke="#0f172a" stroke-width="10"/>

  <!-- Manager Tactic Badge Icon -->
  <circle cx="390" cy="390" r="70" fill="#f59e0b" stroke="#ffffff" stroke-width="8"/>
  <text x="390" y="405" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">FM</text>
</svg>

